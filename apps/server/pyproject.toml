[project]
name = "slopolis-server"
version = "0.0.0"
description = "Slopolis FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "slopolis-core",
    "slopolis-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "arq>=0.26",
    "itsdangerous>=2.2",
]

[tool.uv.sources]
slopolis-core = { workspace = true }
slopolis-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
