[project]
name = "slopolis-worker"
version = "0.0.0"
description = "Slopolis ARQ background worker"
requires-python = ">=3.12"
dependencies = [
    "slopolis-core",
    "slopolis-db",
    "arq>=0.26",
]

[tool.uv.sources]
slopolis-core = { workspace = true }
slopolis-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
