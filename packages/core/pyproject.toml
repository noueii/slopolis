[project]
name = "slopolis-core"
version = "0.0.0"
description = "Slopolis shared core domain and configuration"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "githubkit>=0.12",
    # [crypto] pulls in `cryptography`: every App JWT is signed with RS256, and
    # githubkit's AppAuth raises NotImplementedError without it.
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "litellm>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slopolis_core"]
