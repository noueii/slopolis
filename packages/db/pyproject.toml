[project]
name = "slopolis-db"
version = "0.0.0"
description = "Slopolis database layer: SQLAlchemy models and migrations"
requires-python = ">=3.12"
dependencies = [
    "slopolis-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[tool.uv.sources]
slopolis-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slopolis_db"]
