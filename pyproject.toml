[project]
name = "slopolis"
version = "0.0.0"
description = "Slopolis monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/db",
    "apps/server",
    "apps/worker",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "basedpyright>=1.21",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["slopolis_core", "slopolis_db"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages", "apps"]
exclude = ["**/.venv", "**/__pycache__", "**/node_modules"]
extraPaths = ["packages/core/tests", "apps/worker/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/core/tests",
    "packages/db/tests",
    "apps/server/tests",
    "apps/worker/tests",
    "tests",
]
